<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuarkStudio — Визуальный игровой 3D редактор</title>
  </head>
  <body>
    <div id="app" class="studio-shell">
      <header class="topbar">
        <div class="tb-group">
          <span class="brand">Quark<b>Studio</b></span>
          <input id="inp-proj-name" class="proj-name" value="Побег из комнаты" title="Название игры" />
          <select id="sel-template" title="Загрузить стартовый шаблон">
            <option value="escapeRoom">Шаблон: Побег из комнаты</option>
            <option value="parkour">Шаблон: Неоновый Паркур</option>
            <option value="empty">Шаблон: Пустой мир</option>
          </select>
        </div>

        <div class="tb-group">
          <button id="btn-undo" title="Отменить (Ctrl+Z)">↶ Undo</button>
          <button id="btn-redo" title="Повторить (Ctrl+Y)">↷ Redo</button>
        </div>

        <div class="tb-group">
          <button id="btn-tool-translate" class="active" title="Перемещение (W)">Move</button>
          <button id="btn-tool-rotate" title="Вращение (E)">Rotate</button>
          <button id="btn-tool-scale" title="Масштаб (R)">Scale</button>
          <label class="tb-chk" title="Привязка к сетке 0.5м и углам 15°">
            <input type="checkbox" id="chk-snap" checked /> Snap 0.5м
          </label>
        </div>

        <div class="tb-group">
          <select id="sel-add-kind">
            <option value="">+ Добавить в мир...</option>
            <option value="box">Куб / Стена (Статика)</option>
            <option value="crate">Ящик (Физика)</option>
            <option value="room">Комната с дверью</option>
            <option value="stairs">Лестница</option>
            <option value="ramp">Рампа</option>
            <option value="sphere">Сфера (Физика)</option>
            <option value="cylinder">Колонна / Цилиндр</option>
            <option value="pool">Бассейн с 3D водой</option>
            <option value="trigger">Зона-Триггер (События)</option>
            <option value="breakable">Ломаемое стекло</option>
            <option value="pointLight">Точечный свет</option>
            <option value="spotLight">Прожектор (Тени)</option>
          </select>
          <label class="btn-like" title="Импорт 3D модели .glb">
            + .GLB <input type="file" id="inp-glb" accept=".glb" hidden />
          </label>
        </div>

        <div class="tb-group tb-right">
          <button id="btn-play" class="btn-play">▶ PLAY</button>
          <button id="btn-save" title="Сохранить проект в браузере">💾</button>
          <button id="btn-export" title="Скачать файл игры .quark.json">⬇ JSON</button>
          <label class="btn-like" title="Открыть файл .quark.json">
            📂 <input type="file" id="inp-import" accept=".json,.quark.json" hidden />
          </label>
        </div>
      </header>

      <main class="workspace">
        <aside class="dock dock-left">
          <div class="dock-head">
            <span>Сцена (Объекты)</span>
            <input id="inp-search" class="search" placeholder="Поиск..." />
          </div>
          <div id="outliner-list" class="outliner-list"></div>
          <div class="dock-foot">
            <button id="btn-focus" title="Приблизить камеру (F)">🎯 Фокус (F)</button>
            <button id="btn-dup" title="Дублировать (Ctrl+D)">⧉ Копия</button>
            <button id="btn-del" class="btn-danger" title="Удалить (Del)">🗑</button>
          </div>
        </aside>

        <section class="center-col">
          <div class="viewport-wrap" id="viewport-wrap">
            <canvas id="viewport"></canvas>
            <div class="vp-badge" id="vp-stats">QuarkEngine · Loading...</div>
            <div class="vp-hint" id="vp-hint">Edit Mode: ЛКМ выбор/Gizmo · ПКМ/Drag орбита · Колесо зум · F фокус</div>
            <div class="play-hud" id="play-hud">
              <div class="crosshair" id="play-crosshair"></div>
              <div class="play-top-bar">
                <span id="play-counters"></span>
                <button id="btn-stop-play" class="btn-stop">■ STOP (ESC)</button>
              </div>
              <div class="play-banner" id="play-banner"></div>
            </div>
          </div>

          <div class="bottom-drawer" id="bottom-drawer">
            <div class="drawer-tabs">
              <div class="tabs-left">
                <button class="tab-btn active" data-tab="blueprints">📐 Ноды логики (Blueprints)</button>
                <button class="tab-btn" data-tab="shaders">🎨 Текстуры и Шейдеры</button>
                <button class="tab-btn" data-tab="world">🌍 Мир, Свет и Качество</button>
              </div>
              <button id="btn-toggle-drawer" title="Свернуть/Развернуть панель">▾</button>
            </div>
            <div id="tab-blueprints" class="drawer-body active"></div>
            <div id="tab-shaders" class="drawer-body"></div>
            <div id="tab-world" class="drawer-body"></div>
          </div>
        </section>

        <aside class="dock dock-right">
          <div class="dock-head">
            <span>Инспектор</span>
            <span id="insp-id" class="muted">Не выбрано</span>
          </div>
          <div id="inspector-body" class="inspector-body">
            <div class="empty-msg">Выбери объект в сцене или кликни по нему во вьюпорте</div>
          </div>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
